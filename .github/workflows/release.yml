name: Release

on:
  push:
    branches: [production]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = .*?: "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/v$VERSION_NAME" >/dev/null; then
            echo "::error::Tag v$VERSION_NAME already exists. Bump versionName in app/build.gradle.kts before pushing to production."
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Build signed APK and AAB
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Rename outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ReadingLight-${VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/ReadingLight-${VERSION_NAME}.aab"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: ReadingLight ${{ env.VERSION_NAME }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(env.VERSION_NAME, '-') }}

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
